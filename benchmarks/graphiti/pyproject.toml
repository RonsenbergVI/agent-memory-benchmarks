[project]
name = "graphiti"
version = "0.1.0-alpha.1" # x-release-please-version
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "René-Jean Corneille", email = "corneille.r.j@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "amb",
    "graphiti-core>=0.29,<0.30",
]

[project.entry-points."amb.systems"]
graphiti = "src.benchmark:GraphitiBenchmark"

[tool.uv.sources]
amb = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
