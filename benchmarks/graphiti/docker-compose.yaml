services:
  neo4j:
    image: neo4j:5.26
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  benchmark:
    build:
      context: ../..
      dockerfile: benchmarks/graphiti/Dockerfile
    image: amb-graphiti
    depends_on:
      neo4j:
        condition: service_healthy
    env_file:
      - path: ../../.env
        required: false
    environment:
      # a native crash (SIGSEGV/SIGABRT) prints the failing stack instead
      # of a bare exit code
      - PYTHONFAULTHANDLER=1
      # httpx2 (openai's HTTP stack) defaults to a truststore SSL context,
      # which mutates the OpenSSL cert store on every handshake and is not
      # thread-safe — parallel workers' concurrent handshakes corrupt the
      # heap (double free -> abort). SSL_CERT_FILE makes httpx2 build a
      # plain stdlib context over certifi instead, which is thread-safe.
      - SSL_CERT_FILE=/amb/.venv/lib/python3.13/site-packages/certifi/cacert.pem
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - ${OPENAI_API_KEY:+OPENAI_API_KEY=}${OPENAI_API_KEY:-_AMB_UNSET_OPENAI=1}
      - ${HF_TOKEN:+HF_TOKEN=}${HF_TOKEN:-_AMB_UNSET_HF=1}
    command: run --system graphiti --dataset locomo
    volumes:
      - ../../.data:/amb/.data
      - ../../runs:/amb/runs

volumes:
  neo4j-data:
  neo4j-logs:
