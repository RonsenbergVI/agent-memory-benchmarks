[project]
# not `honcho`: on PyPI that is an unrelated Procfile runner, and it is
# also the server's own project name; the client is `honcho-ai`
name = "honcho-benchmark"
version = "0.1.0"
description = "Honcho benchmark."
readme = "README.md"
authors = [
    { name = "René-Jean Corneille", email = "corneille.r.j@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "amb",
    # the SDK line shipped beside the server tag in docker-compose.yaml
    "honcho-ai>=2.5.1,<2.6",
]

# every integration ships its module as `src` — SDKs own the pretty names
[project.entry-points."amb.systems"]
honcho = "src.benchmark:HonchoBenchmark"

[tool.uv.sources]
amb = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
