# The API and the deriver are two processes over one image and one database;
# Honcho publishes no image, so both are built from the pinned source tag.
x-honcho-server: &honcho-server
  build:
    context: https://github.com/plastic-labs/honcho.git#v3.2.2
  image: amb-honcho-server:3.2.2
  depends_on:
    db:
      condition: service_healthy
  env_file:
    - path: ../../.env
      required: false
  environment:
    - DB_CONNECTION_URI=postgresql+psycopg://honcho:honcho@db:5432/honcho
    # the deriver is the only LLM feature on the measured path: summaries and
    # dreams are switched off per workspace by the adapter, and the dialectic
    # is never called
    - DERIVER_MODEL_CONFIG__TRANSPORT=openai
    - DERIVER_MODEL_CONFIG__MODEL=gpt-5-mini
    # Honcho's template value; unset, gpt-5-mini reasons at "medium" and spends
    # the deriver's whole 2500-token budget thinking — 5 of 6 calls in a smoke
    # run came back empty and stored no conclusions
    - DERIVER_MODEL_CONFIG__THINKING_EFFORT=minimal
    - EMBEDDING_MODEL_CONFIG__TRANSPORT=openai
    - EMBEDDING_MODEL_CONFIG__MODEL=text-embedding-3-small
    # process each session as soon as it lands instead of batching toward a
    # token threshold for up to 30 min — Honcho's own bench harness does the same
    - DERIVER_FLUSH_ENABLED=true
    # one worker per conversation CI runs in parallel (--workers 3), so one
    # conversation's ingest time does not include another's queue
    - DERIVER_WORKERS=3
    # the adapter drains the queue after every session, idling it in between;
    # backoff would charge up to 30 s of poll sleep to each session's ingest
    - DERIVER_POLLING_BACKOFF_ENABLED=false
    - ${OPENAI_API_KEY:+OPENAI_API_KEY=}${OPENAI_API_KEY:-_AMB_UNSET_OPENAI=1}

services:
  db:
    # PostgreSQL 15 + pgvector 0.8.6 (Honcho's own compose runs pg15), pinned
    # by digest: a different pgvector changes retrieval without changing Honcho
    image: pgvector/pgvector@sha256:a947c45cdc5906a1bc951f20a8709e321256343ee0f251e4ae00b5e7def4e6da
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      - POSTGRES_USER=honcho
      - POSTGRES_PASSWORD=honcho
      - POSTGRES_DB=honcho
    volumes:
      - honcho-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U honcho -d honcho"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    <<: *honcho-server
    # Honcho reads its key as LLM_OPENAI_API_KEY; env_file cannot rename a
    # variable, so the mapping happens at exec time — from .env or CI alike
    entrypoint: ["/bin/sh", "-c", "LLM_OPENAI_API_KEY=\"$$OPENAI_API_KEY\" exec sh docker/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 40

  deriver:
    <<: *honcho-server
    # after the API, which runs the migrations the deriver needs
    depends_on:
      api:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c", "LLM_OPENAI_API_KEY=\"$$OPENAI_API_KEY\" exec /app/.venv/bin/python -m src.deriver"]

  benchmark:
    build:
      context: ../..
      dockerfile: benchmarks/honcho/Dockerfile
    image: amb-honcho
    depends_on:
      api:
        condition: service_healthy
      deriver:
        condition: service_started
    env_file:
      - path: ../../.env
        required: false
    environment:
      - HONCHO_BASE_URL=http://api:8000
      - ${OPENAI_API_KEY:+OPENAI_API_KEY=}${OPENAI_API_KEY:-_AMB_UNSET_OPENAI=1}
      - ${HF_TOKEN:+HF_TOKEN=}${HF_TOKEN:-_AMB_UNSET_HF=1}
    command: run --system honcho --dataset locomo
    volumes:
      - ../../.data:/amb/.data
      - ../../runs:/amb/runs

volumes:
  honcho-pgdata:
