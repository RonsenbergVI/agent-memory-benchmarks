services:
  fraise:
    # v0.3.7 (commit 237a4df0), pinned by digest
    image: ghcr.io/fraisehq/fraise@sha256:e5a66c490b2165835e129bc0519a4b4949542828b36cd08fbc1f66148b0b53f9
    # one graph per conversation (the SDK selector's uint8 ceiling); the
    # adapter's num_graphs param must match
    command: ["-num-graphs", "256"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9876/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  benchmark:
    build:
      context: ../..
      dockerfile: benchmarks/fraise/Dockerfile
    image: amb-fraise
    depends_on:
      fraise:
        condition: service_healthy
    env_file:
      - path: ../../.env
        required: false
    environment:
      - FRAISE_BASE_URL=http://fraise:9876
      - ${OPENAI_API_KEY:+OPENAI_API_KEY=}${OPENAI_API_KEY:-_AMB_UNSET_OPENAI=1}
      - ${ANTHROPIC_API_KEY:+ANTHROPIC_API_KEY=}${ANTHROPIC_API_KEY:-_AMB_UNSET_ANTHROPIC=1}
      - ${HF_TOKEN:+HF_TOKEN=}${HF_TOKEN:-_AMB_UNSET_HF=1}
    command: run --system fraise --dataset locomo --model anthropic:claude-haiku-5-5
    volumes:
      - ../../.data:/amb/.data
      - ../../runs:/amb/runs
