services:
  fraise:
    # v0.1.0-rc.1 (commit 0a3364fe). ghcr publishes no semver tags for this
    # image — only `edge` and per-commit tags — so the release is pinned by
    # digest, and the version it corresponds to is recorded here because the
    # digest alone does not say.
    image: ghcr.io/fraisehq/fraise@sha256:33f3a452a573af82f877a2ed624446b5bcce5a483683029c5e024c41c2e4dd79
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9876/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  benchmark:
    build:
      context: ../..
      dockerfile: benchmarks/fraise/Dockerfile
    image: amb-fraise
    depends_on:
      fraise:
        condition: service_healthy
    env_file:
      - path: ../../.env
        required: false
    environment:
      - FRAISE_BASE_URL=http://fraise:9876
      - ${OPENAI_API_KEY:+OPENAI_API_KEY=}${OPENAI_API_KEY:-_AMB_UNSET_OPENAI=1}
      - ${HF_TOKEN:+HF_TOKEN=}${HF_TOKEN:-_AMB_UNSET_HF=1}
    command: run --system fraise --dataset locomo
    volumes:
      - ../../.data:/amb/.data
      - ../../runs:/amb/runs
