services:
  fraise:
    # v0.1.0-rc.2 (commit 78d4ee4f), pinned by digest
    image: ghcr.io/fraisehq/fraise@sha256:b5a11f7db17a5d7ff026ade7b9b8844bcbbe9dbe6c7660877c681fa3b3295a80
    # one graph per conversation (the SDK selector's uint8 ceiling); the
    # adapter's num_graphs param must match
    command: ["-num-graphs", "256"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9876/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  benchmark:
    build:
      context: ../..
      dockerfile: benchmarks/fraise/Dockerfile
    image: amb-fraise
    depends_on:
      fraise:
        condition: service_healthy
    env_file:
      - path: ../../.env
        required: false
    environment:
      - FRAISE_BASE_URL=http://fraise:9876
      - ${OPENAI_API_KEY:+OPENAI_API_KEY=}${OPENAI_API_KEY:-_AMB_UNSET_OPENAI=1}
      - ${HF_TOKEN:+HF_TOKEN=}${HF_TOKEN:-_AMB_UNSET_HF=1}
    command: run --system fraise --dataset locomo
    volumes:
      - ../../.data:/amb/.data
      - ../../runs:/amb/runs
