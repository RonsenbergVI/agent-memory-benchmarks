services:
  fraise:
    image: ghcr.io/fraisehq/fraise:sha256-57196b2a7113b3ecddb1c7d4725d24dd873238c15994476742a17720ec3de2e4
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9876/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  benchmark:
    build:
      context: ../..
      dockerfile: benchmarks/fraise/Dockerfile
    image: amb-fraise
    depends_on:
      fraise:
        condition: service_healthy
    env_file:
      - path: ../../.env
        required: false
    environment:
      - FRAISE_BASE_URL=http://fraise:9876
      - ${OPENAI_API_KEY:+OPENAI_API_KEY=}${OPENAI_API_KEY:-_AMB_UNSET_OPENAI=1}
      - ${HF_TOKEN:+HF_TOKEN=}${HF_TOKEN:-_AMB_UNSET_HF=1}
    command: run --system fraise --dataset locomo
    volumes:
      - ../../.data:/amb/.data
      - ../../runs:/amb/runs
