[project]
name = "fraise"
version = "0.1.0" # x-release-please-version
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "René-Jean Corneille", email = "corneille.r.j@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "amb",
    "fraise-sdk>=0.1.0a1,<0.2",
    # for the SDK's OpenAIEmbedder (the published alpha declares no
    # `openai` extra yet) and the usage tracker
    "openai>=2,<3",
]

# every integration ships its module as `src` — SDKs own the pretty names
[project.entry-points."amb.systems"]
fraise = "src.benchmark:FraiseBenchmark"

[tool.uv.sources]
amb = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
