[project]
# not `langmem`: that is the SDK's own distribution name, and a workspace
# member of the same name resolves against itself. The Dockerfile
# (`uv sync --package langmem-benchmark`), the release-please extra-files
# jsonpath and uv.lock all key off this name.
name = "langmem-benchmark"
version = "0.1.0"
description = "LangMem benchmark."
readme = "README.md"
authors = [
    { name = "René-Jean Corneille", email = "corneille.r.j@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "amb",
    "langmem>=0.0.30,<0.1",
    # LangMem is store-agnostic: it reads and writes a LangGraph BaseStore,
    # and the store is what actually holds and searches the memories. This
    # is the one measured here — Postgres + pgvector, the store LangMem's
    # own docs reach for outside a notebook.
    "langgraph-checkpoint-postgres>=3.1,<4",
    # the store's dist asks for bare `psycopg`, which needs a system libpq;
    # the binary wheel is what makes the image self-contained
    "psycopg[binary]>=3.2,<4",
]

# every integration ships its module as `src` — SDKs own the pretty names
[project.entry-points."amb.systems"]
langmem = "src.benchmark:LangMemBenchmark"

[tool.uv.sources]
amb = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
