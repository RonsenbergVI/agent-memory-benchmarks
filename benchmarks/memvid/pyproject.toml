[project]
name = "memvid"
version = "0.1.0"
description = "memvid benchmark."
readme = "README.md"
authors = [
    { name = "René-Jean Corneille", email = "corneille.r.j@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "amb",
    # the wheel bundles the Rust core, so this pin is the system's version too
    "memvid-sdk>=2.0.160,<2.1",
]

# every integration ships its module as `src` — SDKs own the pretty names
[project.entry-points."amb.systems"]
memvid = "src.benchmark:MemvidBenchmark"

[tool.uv.sources]
amb = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
