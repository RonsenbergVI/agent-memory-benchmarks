services:
  agentmemory:
    build:
      context: ../..
      dockerfile: benchmarks/agentmemory/server.Dockerfile
      args:
        AGENTMEMORY_VERSION: "0.9.29"
        # 0.11.6 breaks agentmemory — empty search after save (see README)
        III_VERSION: "0.11.2"
        III_SDK_VERSION: "0.11.2"
    image: amb-agentmemory-server
    env_file:
      - path: ../../.env
        required: false
    environment:
      - AGENTMEMORY_DATA_DIR=/data
      # both legs on to match the comparison (README "What it measures"); the
      # embedding dimension stays looked-up — an explicit value makes every embed throw
      - EMBEDDING_PROVIDER=openai
      - OPENAI_EMBEDDING_MODEL=text-embedding-3-small
      - OPENAI_MODEL=gpt-5-mini
      - AGENTMEMORY_AUTO_COMPRESS=true
      - CONSOLIDATION_ENABLED=false
      # a reused volume whose index width changed refuses to boot without this
      - AGENTMEMORY_DROP_STALE_INDEX=true
      # CI has no .env; keyless boot is fatal with the provider forced to openai
      - ${OPENAI_API_KEY:+OPENAI_API_KEY=}${OPENAI_API_KEY:-_AMB_UNSET_OPENAI=1}
      - ${AGENTMEMORY_SECRET:+AGENTMEMORY_SECRET=}${AGENTMEMORY_SECRET:-_AMB_UNSET_AM_SECRET=1}
    volumes:
      - agentmemory-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3111/agentmemory/livez || exit 1"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 30

  benchmark:
    build:
      context: ../..
      dockerfile: benchmarks/agentmemory/Dockerfile
    image: amb-agentmemory
    depends_on:
      agentmemory:
        condition: service_healthy
    env_file:
      - path: ../../.env
        required: false
    environment:
      - AGENTMEMORY_BASE_URL=http://agentmemory:3111
      - ${AGENTMEMORY_SECRET:+AGENTMEMORY_SECRET=}${AGENTMEMORY_SECRET:-_AMB_UNSET_AM_SECRET=1}
      # answering and judging models
      - ${OPENAI_API_KEY:+OPENAI_API_KEY=}${OPENAI_API_KEY:-_AMB_UNSET_OPENAI=1}
      - ${HF_TOKEN:+HF_TOKEN=}${HF_TOKEN:-_AMB_UNSET_HF=1}
    # --workers 1 is the only exact-isolation setting (see README)
    command: run --system agentmemory --dataset locomo --workers 1
    volumes:
      - ../../.data:/amb/.data
      - ../../runs:/amb/runs

volumes:
  agentmemory-data:
