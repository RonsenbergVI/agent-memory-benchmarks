services:
  # agentmemory publishes to npm, not to a container registry, so the
  # server is built here from the project's own deploy template: node +
  # the iii engine binary + the pinned npm package. Both versions are
  # build args so a bump is one line and its own commit.
  agentmemory:
    build:
      context: ../..
      dockerfile: benchmarks/agentmemory/server.Dockerfile
      args:
        AGENTMEMORY_VERSION: "0.9.29"
        # pinned by upstream: the engine's own caret range resolves to
        # 0.11.6, which needs a worker model agentmemory has not been
        # refactored for — the mismatch shows up as empty search after
        # save, not as a startup error
        III_VERSION: "0.11.2"
        III_SDK_VERSION: "0.11.2"
    image: amb-agentmemory-server
    env_file:
      - path: ../../.env
        required: false
    environment:
      - AGENTMEMORY_DATA_DIR=/data
      # Embeddings on, LLM off. Keyless, agentmemory retrieves with BM25
      # only — its weakest mode, and not what its own README headlines.
      # The provider is forced and the key is handed over under the
      # embedding-scoped name by the entrypoint; the bare OPENAI_API_KEY
      # is unset there because its presence alone would switch on LLM
      # compression and consolidation too.
      #
      # OPENAI_EMBEDDING_MODEL is already this value by default; it is
      # set so the run's configuration is on the record. The dimension
      # (1536) is looked up from the model — a wrong explicit value makes
      # every embed throw. BM25/VECTOR weights are left alone: already
      # 0.4/0.6, and a fusion ratio rather than a gate on the vector leg.
      - EMBEDDING_PROVIDER=openai
      - OPENAI_EMBEDDING_MODEL=text-embedding-3-small
      # explicit belt-and-braces; both are already the defaults
      - CONSOLIDATION_ENABLED=false
      - AGENTMEMORY_AUTO_COMPRESS=false
      # a persisted index whose width differs from the active provider
      # makes the worker refuse to boot; this stack starts from an empty
      # volume, and the flag keeps a reused one from wedging
      - AGENTMEMORY_DROP_STALE_INDEX=true
      - ${AGENTMEMORY_SECRET:+AGENTMEMORY_SECRET=}${AGENTMEMORY_SECRET:-_AMB_UNSET_AM_SECRET=1}
    volumes:
      - agentmemory-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3111/agentmemory/livez || exit 1"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 30

  benchmark:
    build:
      context: ../..
      dockerfile: benchmarks/agentmemory/Dockerfile
    image: amb-agentmemory
    depends_on:
      agentmemory:
        condition: service_healthy
    env_file:
      - path: ../../.env
        required: false
    environment:
      - AGENTMEMORY_BASE_URL=http://agentmemory:3111
      - ${AGENTMEMORY_SECRET:+AGENTMEMORY_SECRET=}${AGENTMEMORY_SECRET:-_AMB_UNSET_AM_SECRET=1}
      # the answering and judging models only; the memory system itself
      # makes no API call while the server is keyless
      - ${OPENAI_API_KEY:+OPENAI_API_KEY=}${OPENAI_API_KEY:-_AMB_UNSET_OPENAI=1}
      - ${HF_TOKEN:+HF_TOKEN=}${HF_TOKEN:-_AMB_UNSET_HF=1}
    # --workers 1: agentmemory filters by agent id *after* retrieval, so
    # a second conversation resident at the same time can crowd this
    # one's hits out of the over-fetch window. One at a time is the only
    # setting where the isolation is exact. See the README.
    command: run --system agentmemory --dataset locomo --workers 1
    volumes:
      - ../../.data:/amb/.data
      - ../../runs:/amb/runs

volumes:
  agentmemory-data:
