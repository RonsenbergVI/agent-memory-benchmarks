services:
  # agentmemory publishes to npm, not a container registry, so the server
  # is built here from the project's own deploy template; versions are
  # build args so a bump is one line.
  agentmemory:
    build:
      context: ../..
      dockerfile: benchmarks/agentmemory/server.Dockerfile
      args:
        AGENTMEMORY_VERSION: "0.9.29"
        # pinned by upstream: the caret range resolves to 0.11.6, whose
        # worker model agentmemory is not refactored for — shows up as
        # empty search after save, not as a startup error
        III_VERSION: "0.11.2"
        III_SDK_VERSION: "0.11.2"
    image: amb-agentmemory-server
    # no env_file on purpose: the ledger measures OSS-runnable operation only,
    # so no platform key ever reaches the system under test — keyless,
    # agentmemory runs zero-LLM (BM25 + on-device embeddings), and a local
    # .env key would silently switch its paid legs on
    environment:
      - AGENTMEMORY_DATA_DIR=/data
      # an index whose width differs from the active provider refuses to
      # boot; the flag keeps a reused volume from wedging
      - AGENTMEMORY_DROP_STALE_INDEX=true
      - ${AGENTMEMORY_SECRET:+AGENTMEMORY_SECRET=}${AGENTMEMORY_SECRET:-_AMB_UNSET_AM_SECRET=1}
    volumes:
      - agentmemory-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3111/agentmemory/livez || exit 1"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 30

  benchmark:
    build:
      context: ../..
      dockerfile: benchmarks/agentmemory/Dockerfile
    image: amb-agentmemory
    depends_on:
      agentmemory:
        condition: service_healthy
    env_file:
      - path: ../../.env
        required: false
    environment:
      - AGENTMEMORY_BASE_URL=http://agentmemory:3111
      - ${AGENTMEMORY_SECRET:+AGENTMEMORY_SECRET=}${AGENTMEMORY_SECRET:-_AMB_UNSET_AM_SECRET=1}
      # answering and judging models only — the keyless server makes no API call
      - ${OPENAI_API_KEY:+OPENAI_API_KEY=}${OPENAI_API_KEY:-_AMB_UNSET_OPENAI=1}
      - ${HF_TOKEN:+HF_TOKEN=}${HF_TOKEN:-_AMB_UNSET_HF=1}
    # --workers 1: the agent-id filter runs *after* retrieval, so a second
    # resident conversation can crowd this one's hits out of the over-fetch
    # window; one at a time is the only exact-isolation setting. See the README.
    command: run --system agentmemory --dataset locomo --workers 1
    volumes:
      - ../../.data:/amb/.data
      - ../../runs:/amb/runs

volumes:
  agentmemory-data:
