[project]
# not `agentmemory`: that PyPI name is a different project
# (AutonomousResearchGroup); the system measured is rohitg00/agentmemory
name = "agentmemory-benchmark"
version = "0.2.0"
description = "agentmemory benchmark."
readme = "README.md"
authors = [
    { name = "René-Jean Corneille", email = "corneille.r.j@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "amb",
    "httpx>=0.27,<1",
]

# every integration ships its module as `src` — SDKs own the pretty names
[project.entry-points."amb.systems"]
agentmemory = "src.benchmark:AgentMemoryBenchmark"

[tool.uv.sources]
amb = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
