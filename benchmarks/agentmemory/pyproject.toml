[project]
# not `agentmemory`: that PyPI name belongs to a different project
# (AutonomousResearchGroup/agentmemory), and the system measured here is
# rohitg00/agentmemory, which publishes to npm and ships no Python SDK
name = "agentmemory-benchmark"
version = "0.0.0"
description = "agentmemory benchmark."
readme = "README.md"
authors = [
    { name = "René-Jean Corneille", email = "corneille.r.j@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "amb",
    "httpx>=0.27,<1",
]

# every integration ships its module as `src` — SDKs own the pretty names
[project.entry-points."amb.systems"]
agentmemory = "src.benchmark:AgentMemoryBenchmark"

[tool.uv.sources]
amb = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
