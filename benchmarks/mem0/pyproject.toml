[project]
name = "mem0"
version = "0.2.0"
description = "Mem0 benchmark."
readme = "README.md"
authors = [
    { name = "René-Jean Corneille", email = "corneille.r.j@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "amb",
    "mem0ai[nlp]>=2.0,<3",
    "fastembed>=0.3.1",
    "en-core-web-sm",
]

[project.entry-points."amb.systems"]
mem0 = "src.benchmark:Mem0Benchmark"

[tool.uv.sources]
amb = { workspace = true }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
