[project]
name = "supermemory-benchmark"
version = "0.0.0"
description = "Supermemory benchmark."
readme = "README.md"
authors = [
    { name = "René-Jean Corneille", email = "corneille.r.j@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "amb",
    "supermemory>=3.59,<4",
]

# every integration ships its module as `src` — SDKs own the pretty names
[project.entry-points."amb.systems"]
supermemory = "src.benchmark:SupermemoryBenchmark"

[tool.uv.sources]
amb = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
