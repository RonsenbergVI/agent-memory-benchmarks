[project]
name = "letta"
version = "0.1.0" # x-release-please-version
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "René-Jean Corneille", email = "corneille.r.j@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "amb",
    # computes the server-side embedding spend (see src/memory.py)
    "tiktoken>=0.8",
    "letta-client>=1.12.1,<2",
]

[project.entry-points."amb.systems"]
letta = "src.benchmark:LettaBenchmark"

[tool.uv.sources]
amb = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
