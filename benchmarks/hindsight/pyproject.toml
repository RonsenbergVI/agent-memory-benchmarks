[project]
# not `hindsight`: that PyPI name belongs to an unrelated project, and
# the client this measures with is published as `hindsight-client`
name = "hindsight-benchmark"
version = "0.6.0"
description = "Hindsight benchmark."
readme = "README.md"
authors = [
    { name = "René-Jean Corneille", email = "corneille.r.j@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "amb",
    # exactly the server's version: HINDSIGHT_API_VERSION in server.Dockerfile
    # and docker-compose.yaml move with this pin, never apart from it
    "hindsight-client==1.0.0",
]

# every integration ships its module as `src` — SDKs own the pretty names
[project.entry-points."amb.systems"]
hindsight = "src.benchmark:HindsightBenchmark"

[tool.uv.sources]
amb = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
