name: Release snapshot

# A harness release runs no benchmark: it freezes the results already on
# main into the GitHub Release release-please just created, so the tag
# names a citable leaderboard. Reruns are per-system tags or dispatch.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.0"]

permissions:
  contents: write

jobs:
  snapshot:
    name: attach results to the release
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the workspace
        run: uv sync --locked

      - name: Attach the results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUMMARY_K: 10
        run: |
          if [ -z "$(find runs -name summary.json 2>/dev/null | head -1)" ]; then
            echo "no runs committed yet"; exit 0
          fi
          uv run amb report --latest --k "$SUMMARY_K" \
            --output RESULTS.md \
            --commit "$GITHUB_SHA" --tag "$GITHUB_REF_NAME"
          tar czf "results-$GITHUB_REF_NAME.tar.gz" runs plots RESULTS.md
          gh release upload "$GITHUB_REF_NAME" RESULTS.md \
            "results-$GITHUB_REF_NAME.tar.gz" --clobber
