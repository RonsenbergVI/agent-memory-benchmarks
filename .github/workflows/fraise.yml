name: Benchmark fraise

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# one benchmark run at a time; a second trigger queues rather than
# interleaving report/ artifacts and the final commit
concurrency:
  group: benchmark

permissions:
  contents: write

env:
  # the k the README summary table compares at; the chart sets cover every
  # k the runs actually used, so this narrows the headline only
  SUMMARY_K: 10

# one job per dataset: each has different scope parameters, so each gets
# its own matrix of plain values and a flat run command. Agentic mode gets
# its own jobs here later (with the driving-model env).
jobs:
  locomo:
    name: fraise / locomo / direct / k${{ matrix.k }} / t${{ matrix.turns }} / q${{ matrix.questions }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        k: [1, 3, 5, 10]
        # turns ingested / questions asked, per conversation
        turns: [100]
        questions: [20]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the workspace
        run: uv sync --locked

      # pulled on the runner; the compose stack volume-mounts .data/
      - name: Pull the dataset
        run: uv run amb datasets pull locomo

      # the fraise image lives on ghcr; login makes the pull work whether
      # the package is public or private to this owner
      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run the benchmark
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          docker compose -f benchmarks/fraise/docker-compose.yaml \
            run --build --rm benchmark run --system fraise \
            --dataset locomo --mode direct \
            --turns ${{ matrix.turns }} --questions ${{ matrix.questions }} \
            --k ${{ matrix.k }}
          docker compose -f benchmarks/fraise/docker-compose.yaml down -v

      - name: Upload run reports
        uses: actions/upload-artifact@v4
        with:
          name: report-fraise-locomo-direct-k${{ matrix.k }}
          path: report/
          if-no-files-found: error

  longmemeval:
    name: fraise / longmemeval / direct / k${{ matrix.k }} / ${{ matrix.variant }} / l${{ matrix.limit }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        k: [1, 3, 5, 10]
        variant: [oracle]
        # conversations run
        limit: [20]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the workspace
        run: uv sync --locked

      # pulled on the runner; the compose stack volume-mounts .data/
      - name: Pull the dataset
        run: uv run amb datasets pull longmemeval --variant ${{ matrix.variant }}

      # the fraise image lives on ghcr; login makes the pull work whether
      # the package is public or private to this owner
      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run the benchmark
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          docker compose -f benchmarks/fraise/docker-compose.yaml \
            run --build --rm benchmark run --system fraise \
            --dataset longmemeval --mode direct \
            --variant ${{ matrix.variant }} --limit ${{ matrix.limit }} \
            --k ${{ matrix.k }}
          docker compose -f benchmarks/fraise/docker-compose.yaml down -v

      - name: Upload run reports
        uses: actions/upload-artifact@v4
        with:
          name: report-fraise-longmemeval-direct-k${{ matrix.k }}
          path: report/
          if-no-files-found: error

  publish:
    name: publish results to main
    needs: [locomo, longmemeval]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # results land on main regardless of which ref triggered the run
          ref: main

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the workspace
        run: uv sync --locked

      - name: Collect run reports
        uses: actions/download-artifact@v4
        with:
          pattern: report-*
          path: report
          merge-multiple: true

      - name: Regenerate plots and reports
        run: |
          # every run stamps the commit that triggered it; only a real
          # release also stamps its tag
          tag=""
          [ "${{ github.ref_type }}" = "tag" ] && tag="--tag $GITHUB_REF_NAME"
          # both commands read the same report objects, so neither needs to
          # be told which datasets or variants exist: the (dataset, variant)
          # groups are discovered from report/ itself, which holds every run
          # ever committed to main (checkout brings the full tree, not just
          # this run's artifacts). `amb plot all` draws exactly the charts the
          # documents link — every k the runs used, one directory per group
          # — and `amb report` writes the documents that link them, so the
          # two cannot drift apart.
          uv run amb plot all
          uv run amb report --latest --k "$SUMMARY_K" \
            --output RESULTS.md --summary README.md \
            --commit "$GITHUB_SHA" $tag

      # commits as github-actions[bot] and skips cleanly when nothing
      # changed; pushes to the checked-out branch (main)
      - name: Commit results to main
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "results: fraise benchmark run for ${{ github.ref_name }}"
          file_pattern: "report plots RESULTS.md README.md"
