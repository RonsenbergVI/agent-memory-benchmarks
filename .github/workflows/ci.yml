name: CI

on:
  pull_request:
  push:
    branches: [main]

# a new push to a PR cancels the previous run
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate branch name and PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Writes the conventions sticky comment on the PR.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Must match the changelog groups in .goreleaser.yaml
          types: |
            feat
            fix
            perf
            refactor
            chore
            build
            deps
            ci
            docs
            test
            upgrade
            release
          requireScope: false
          # Allow breaking-change marker: feat!: or feat(scope)!:
          headerPattern: '^(\w+)(?:\(([\w\-\.]+)\))?(!)?: (.+)$'
          headerPatternCorrespondence: type, scope, breaking, subject

     # https://github.com/finleyfamily/action-enforce-branch-name
      - name: Validate branch name
        id: branch
        # Skip bot and release branches.
        if: >-
          !startsWith(github.event.pull_request.head.ref, 'dependabot/') &&
          !startsWith(github.event.pull_request.head.ref, 'renovate/') &&
          !startsWith(github.event.pull_request.head.ref, 'release-please') &&
          !startsWith(github.event.pull_request.head.ref, 'revert-')
        uses: finleyfamily/action-enforce-branch-name@c26fb89a6bcfb2fd3af191be15cb03c2d977a41b
        continue-on-error: true
        with:
          regex: '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)\/[a-z0-9]+([-.][a-z0-9]+)*$'
          exclude: main,master,develop

      # https://github.com/marocchino/sticky-pull-request-comment
      - name: Comment on failure
        if: always() && (steps.title.outcome == 'failure' || steps.branch.outcome == 'failure')
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88
        with:
          header: pr-conventions
          skip_unchanged: true
          message: |
            ### ❌ PR conventions check failed

            | Check | Value | Result |
            | --- | --- | --- |
            | PR title | `${{ github.event.pull_request.title }}` | ${{ steps.title.outcome == 'failure' && '❌ invalid' || '✅' }} |
            | Branch name | `${{ github.event.pull_request.head.ref }}` | ${{ steps.branch.outcome == 'failure' && '❌ invalid' || steps.branch.outcome == 'skipped' && '⏭️ exempt' || '✅' }} |

            **Details**

            ```
            ${{ steps.title.outputs.error_message || 'The PR title is fine — fix the branch name.' }}
            ```

            <details><summary>The rules</summary>

            **Title** — `type(optional-scope): subject`

            ```
            feat(api): add request rate limiting
            fix: handle empty response body
            refactor(auth)!: drop legacy session cookies
            ```

            Lowercase subject, no trailing period, 3-60 characters.

            **Branch** — `type/short-description`

            ```
            feat/rate-limiting
            fix/empty-response-body
            ```

            Allowed types: `feat` `fix` `docs` `style` `refactor` `perf` `test` `build` `ci` `chore` `revert`

            Editing the PR title re-runs this check. To rename a branch:
            `git branch -m <new-name> && git push origin -u <new-name>`, then retarget the PR.
            </details>

      - name: Remove comment once fixed
        if: always() && steps.title.outcome != 'failure' && steps.branch.outcome != 'failure'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88
        with:
          header: pr-conventions
          delete: true

      - name: Fail the job
        if: steps.title.outcome == 'failure' || steps.branch.outcome == 'failure'
        run: exit 1

  label:
    name: Label PR
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13
        with:
          sync-labels: true
          configuration-path: .github/labeler.yaml

      - uses: bcoe/conventional-release-labels@886f696738527c7be444262c327c89436dfb95a8
        with:
          type_labels: >-
            {"feat": "feature", "fix": "fix", "perf": "performance",
             "refactor": "maintenance", "chore": "maintenance", "build": "maintenance",
             "deps": "maintenance", "ci": "maintenance", "upgrade": "upgrade",
             "docs": "docs", "test": "test", "style": "maintenance",
             "revert": "maintenance", "release": "release",
             "breaking": "breaking-change"}
          ignored_types: "[]"

  lint:
    name: Pre-commit Hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # hook environments are expensive to build; key them on the config
      - name: Cache pre-commit hooks
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # same command as `make check`, so local and CI cannot drift

      - name: Install the workspace
        run: uv sync --locked --all-extras
      - name: Run pre-commit
        run: uvx pre-commit run --all-files
  test:
    name: tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # uv itself honours .python-version
          enable-cache: true

      # --locked fails if uv.lock is stale rather than silently resolving
      - name: Install the workspace
        run: uv sync --locked --all-extras

      - name: Run tests
        run: uv run pytest

# Integration benchmarks (mem0, graphiti, letta) are deliberately not run
# here: they need databases and paid API keys. The test suite covers the
# pipeline end to end with fixtures, and `make smoke` runs the `naive`
# baseline locally when you want a real dataset in the loop.
