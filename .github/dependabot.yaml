# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# One uv entry covers the whole workspace: dependabot scans from the
# directory that holds uv.lock, bumps member dependencies inside their own
# pyprojects, and regenerates the shared lock in the same PR. Per-member
# entries would update a member manifest without the lock (members have
# none of their own) and fail CI's `uv sync --locked` — never add them.
# Release attribution is by path, so a bump touching
# benchmarks/<name>/pyproject.toml still lands in that package's release
# PR; the release-please config gives `deps:` commits a Dependencies
# changelog section so the bumps show up in release notes.
#
# The github-actions entry sets `labels` to mirror what .github/labeler.yaml
# would apply — dependabot PRs skip the labeler job (their runs get a
# read-only token), and the labels must already exist in the repo. The uv
# entry keeps dependabot's default labels.

version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "deps: "
      prefix-development: "deps: "

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "deps: "
      prefix-development: "deps: "
    labels:
      - area:ci
