# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# `labels` mirrors what .github/labeler.yaml would apply from the changed
# paths — dependabot PRs skip the labeler job (their runs get a read-only
# token). Setting it replaces dependabot's default labels, and the labels
# must already exist in the repo. The root uv entry keeps the defaults:
# no labeler glob covers the root manifest/lock.
#
# Under release-please's always-bump-minor versioning any conventional
# commit is releasable, so prefixes don't gate releases — they pick the
# changelog section. The benchmark entries use `fix(deps):` so SDK bumps
# appear under the release's bug fixes instead of vanishing (`deps` has no
# changelog section); merging that package's release PR re-benchmarks the
# system against the new SDK. Root uv and github-actions bumps stay
# `deps:` — harness dependency noise doesn't belong in release notes.

version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "deps: "
      prefix-development: "deps: "

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "deps: "
      prefix-development: "deps: "
    labels:
      - area:ci

  - package-ecosystem: uv
    directory: /benchmarks/fraise
    schedule:
      interval: daily
    commit-message:
      prefix: "fix(deps): "
      prefix-development: "fix(deps): "
    labels:
      - area:benchmarks
      - memory:fraise

  - package-ecosystem: uv
    directory: /benchmarks/graphiti
    schedule:
      interval: daily
    commit-message:
      prefix: "fix(deps): "
      prefix-development: "fix(deps): "
    labels:
      - area:benchmarks
      - memory:graphiti

  - package-ecosystem: uv
    directory: /benchmarks/letta
    schedule:
      interval: daily
    commit-message:
      prefix: "fix(deps): "
      prefix-development: "fix(deps): "
    labels:
      - area:benchmarks
      - memory:letta

  - package-ecosystem: uv
    directory: /benchmarks/mem0
    schedule:
      interval: daily
    commit-message:
      prefix: "fix(deps): "
      prefix-development: "fix(deps): "
    labels:
      - area:benchmarks
      - memory:mem0
