[project]
name = "amb"
version = "0.1.0"
description = "An ann-benchmarks-style benchmark suite for AI agent memory systems."
authors = [
    { name = "René-Jean Corneille", email = "corneille.r.j@gmail.com" }
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.10",
    "pydantic-ai>=1.107.0",
    "huggingface-hub>=0.34",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "click>=8.1",
    "matplotlib>=3.9",
    "loguru>=0.7",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
amb = "amb.cli:main"

# dbt-style registration: integrations are Memory subclasses registered
# under this group. The core ships only the naive baseline; real integrations
# live in benchmarks/<provider>/ as their own packages (amb-mem0, ...).
[project.entry-points."amb.systems"]
naive = "amb.memory:NaiveBenchmark"

[tool.uv.workspace]
members = ["benchmarks/*"]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amb"]

[tool.uv]
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
]
required-version = ">0.10,<0.13"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "-q", "--capture=no", "-vvv", "--import-mode=importlib"]

[tool.ruff.lint]
preview = true
select = [
    "E",
    "I",
    "F",
    "W",
    "N",
    "I001",
    "I002",
    "ANN",
    "D",
    "DOC",
    "AIR",
    "UP",
    "S102",
    "TID252", # relative imports only allowed for siblings
    "PT"
]
ignore = [
    "E501", # over-length lines, formatter should handle it
    "E741", # ambigous variable name
    "ANN401",
    "D401",
    "D104",
    "D100",
    "D211",
    "D213",
    "DOC201",
    "D203",
    "D107", # no docstring for __init__
    "D415", # duplicate of D400
    "ANN002", # args type hint
    "ANN003", # kwargs type hint
    "PT006",
    "D105", # docstrings for magic methods
    "UP017",
    "E731"
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "D"]

[tool.ty.rules]
unused-ignore-comment = "warn"
redundant-cast = "ignore"
possibly-missing-attribute = "error"
possibly-missing-import = "error"

[tool.ty.src]
include = [
    "src/amb",
    "tests",
]
